services:
  app:
    image: video-box-app:1.1.0
    build:
      context: ./app
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    environment:
      APP_VERSION: "1.1.0"
      APP_SECRET: ${APP_SECRET:-change-me-now}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SESSION_HOURS: ${APP_SESSION_HOURS:-12}
      # 仅用于兼容 v6.x 旧 .env；APP_PASSWORD 优先。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      KEEP_ORIGINAL: ${KEEP_ORIGINAL:-false}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-5}
      DB_PATH: /data/db/video.db
      UPLOAD_DIR: /data/uploads
      MEDIA_DIR: /data/media
      LOG_DIR: /data/logs
    volumes:
      - ./data:/data
    command: ["gunicorn", "-b", "0.0.0.0:8000", "--workers", "1", "--threads", "2", "--timeout", "3600", "app:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: video-box-app:1.1.0
    build:
      context: ./app
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    environment:
      APP_VERSION: "1.1.0"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      KEEP_ORIGINAL: ${KEEP_ORIGINAL:-false}
      DB_PATH: /data/db/video.db
      UPLOAD_DIR: /data/uploads
      MEDIA_DIR: /data/media
      LOG_DIR: /data/logs
      FFMPEG_THREADS: ${FFMPEG_THREADS:-1}
      VIDEO_CRF: ${VIDEO_CRF:-24}
      VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}
      KEEP_DOCUMENT_ORIGINAL: ${KEEP_DOCUMENT_ORIGINAL:-true}
      DOCUMENT_RENDER_DPI: ${DOCUMENT_RENDER_DPI:-120}
      DOCUMENT_JPEG_QUALITY: ${DOCUMENT_JPEG_QUALITY:-82}
    volumes:
      - ./data:/data
    command: ["python", "worker.py"]

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    depends_on:
      - app
    # 安全默认值：只监听宿主机本地。直接对外开放时在 .env 设置 BIND_ADDRESS=0.0.0.0。
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VIDEO_PORT:-8080}:80"
    environment:
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-5g}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./data/media:/data/media:ro
