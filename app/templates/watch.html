<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ video.title }}</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    .stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .state{max-width:680px;padding:24px;text-align:center;line-height:1.7}
    .muted{color:#8b8b8b;font-size:.9rem}.error{color:#ff9b9b;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="stage">
{% if video.status == 'ready' %}
  <video controls playsinline preload="metadata" autoplay {% if video.poster_path %}poster="/poster/{{ video.slug }}"{% endif %}>
    <source src="/stream/{{ video.slug }}" type="video/mp4">
  </video>
{% elif video.status == 'error' %}
  <div class="state error">视频处理失败。</div>
{% else %}
  <div class="state">视频正在处理…<div class="muted" id="stateText">{{ video.status }}</div></div>
  <script>
    const slug = {{ video.slug|tojson }};
    const timer = setInterval(async () => {
      const r = await fetch('/api/status/' + slug, {cache:'no-store'});
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('stateText').textContent = d.progress?.out_time ? `${d.status} · ${d.progress.out_time} · ${d.progress.speed || ''}` : d.status;
      if (d.status === 'ready' || d.status === 'error') { clearInterval(timer); location.reload(); }
    }, 3000);
  </script>
{% endif %}
</div>
</body>
</html>
